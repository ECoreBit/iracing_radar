# iRacing 雷达设置 / iRacing Radar Settings
# SimHub 运行时可直接保存此文件，插件会在约 1 秒内自动重新读取。
# You may save this file while SimHub is running; the plugin reloads it in about one second.

# 前后车辆数值与触发模式：None=不显示数值，Distance=仅距离，Time=仅相对时间，Both=两者。
# Front/rear value and trigger mode: None=no values, Distance=distance only, Time=time gap only, Both=both values.
# Distance 仅按 RadarRangeMeters 提示；Time 仅按 TimeAlertSeconds 提示。
# Distance uses only RadarRangeMeters; Time uses only TimeAlertSeconds.
# Both 和 None 均在距离或相对时间任一条件达到时显示图形；None 只隐藏文字，不隐藏雷达图形。
# Both and None show the graphical alert when either threshold is met; None hides only the text values.
DisplayMode=Both

# 距离触发阈值（米），有效范围 5–200。
# Distance trigger threshold in meters; valid range: 5–200.
# 距离范围最外侧 15% 用于按比例渐显；其余范围完全显示。
# The outermost 15% of the distance range is used for proportional fade-in; the rest is fully visible.
RadarRangeMeters=70

# 是否按警示阶段动态调整雷达范围：true=启用，false=始终使用上方的距离提示范围。
# Dynamically adjust the radar range by alert stage: true=enabled, false=always use the radar range above.
DynamicRadarRangeEnabled=false

# 红色警示区内使用的最小雷达范围（米），有效范围 5–200，且不会超过距离提示范围。绿色阶段使用完整范围，在绿色转红色的过渡区域内平滑缩放。
# Minimum radar range in the red warning zone, in meters; valid range: 5–200 and never above radar range. The full range is used in the green stage and scales smoothly through the green-to-red transition.
DynamicRadarRangeMinimumMeters=35

# 红色近距离警示的起始距离（米），有效范围 1–100，且不会超过 RadarRangeMeters。
# Start of the red near-warning zone in meters; valid range: 1–100 and never above RadarRangeMeters.
NearDistanceMeters=20

# 是否显示前方绿色远距离提示条：true=显示，false=隐藏。
# Show the front green far-distance arc: true=shown, false=hidden.
FrontGreenArcEnabled=true

# 是否显示后方绿色远距离提示条：true=显示，false=隐藏。
# Show the rear green far-distance arc: true=shown, false=hidden.
RearGreenArcEnabled=true

# 是否在快速接近前车时显示预计追上时间：true=显示，false=隐藏。
# Show estimated catch time when rapidly closing on a front car: true=shown, false=hidden.
CatchEstimateEnabled=true

# 是否在局部赛道背景上显示预计追上前车的位置：true=显示，false=隐藏。
# Show the calculated front-car catch point on the local track background: true=shown, false=hidden.
OvertakePredictionEnabled=true

# 是否在排位赛中隐藏整个雷达（包括赛道背景）：true=隐藏，false=正常显示。
# Hide the entire radar during qualifying, including the track background: true=hidden, false=shown normally.
HideInQualifying=true

# 是否显示局部赛道背景：true=显示，false=隐藏。当前赛道没有 SimHub 地图记录时会自动隐藏。
# Show the local track background: true=shown, false=hidden. It hides automatically when no SimHub map record is available.
TrackBackgroundEnabled=true


# 是否始终显示赛道和雷达：true=没有附近车辆时也显示；false=仅在车辆靠近、雷达触发时显示。
# Always show the track and radar: true=visible without nearby cars; false=visible only when an approaching car triggers the radar.
TrackBackgroundAlwaysVisible=false

# 赛道缩放比例（像素/米），有效范围 2–12。数值越小，可见的参考赛道路段越长；本车标记保持清晰大小。
# Track scale in pixels per meter; valid range: 2–12. Lower values show a longer reference section; the player marker keeps its readable size.
TrackScalePixelsPerMeter=3.5

# Reference width of the track background in meters; valid range: 5–20.
# iRacing does not provide real per-position track width, so this value controls visual scale only.
ReferenceTrackWidthMeters=10.5

# 本车图标大小（%），有效范围 50–200；100 表示默认大小。
# Player marker size in percent; valid range: 50–200. 100 is the default size.
PlayerMarkerScalePercent=100

# 相对时间触发阈值（秒），有效范围 0.1–30。
# Time-gap trigger threshold in seconds; valid range: 0.1–30.
TimeAlertSeconds=0.7

# 雷达进入或离开提示范围时用于透明度变化的比例（%），有效范围 1–50；不改变触发值。
# Percentage of the alert-range edge used for radar opacity transition; valid range: 1–50; does not change trigger values.
RadarFadeBandPercent=15

# 前后车辆数值字体大小，有效范围 10–36。
# Front/rear value font size; valid range: 10–36.
LabelFontSize=22

# 整体雷达不透明度：0=不可见，100=完全不透明。
# Overall radar opacity: 0=invisible, 100=fully opaque.
OverlayOpacity=92
